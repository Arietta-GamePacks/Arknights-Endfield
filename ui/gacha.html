<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寻访记录 · 终末地</title>
<style>
  :root {
    --acc: #e6d800;
    --bg: #101116;
    --panel: #1a1c24;
    --panel2: #222530;
    --line: rgba(255,255,255,.09);
    --text: #f2f3f7;
    --muted: #9298a6;
    --good: #e6d800;
    --bad: #e2705f;
    --five: #c864e0;
    --four: #5eaaed;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); min-height:100vh; padding:22px 26px 40px;
    font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;
    font-size:13.5px; line-height:1.55;
  }
  .wrap { max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .title { display:flex; align-items:baseline; gap:12px; }
  .title h1 { font-size:23px; font-weight:700; letter-spacing:.5px; }
  .title .tag { font-size:11.5px; color:var(--acc); border:1px solid rgba(230,216,0,.4);
    padding:2px 8px; border-radius:20px; background:rgba(230,216,0,.07); }
  .sub { color:var(--muted); font-size:12px; margin-top:3px; }
  .sync { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  input[type=text] {
    width:230px; height:34px; padding:0 11px; border-radius:8px; color:var(--text);
    background:rgba(12,14,20,.6); border:1px solid var(--line); outline:none; font-size:12.5px;
  }
  input[type=text]:focus { border-color:rgba(230,216,0,.55); }
  button {
    height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:12.5px; cursor:pointer;
    font-family:inherit; transition:background .15s, border-color .15s;
  }
  button:hover { background:#2c3040; }
  button.primary { background:var(--acc); color:#1a1a05; border-color:var(--acc); font-weight:600; }
  button.primary:hover { background:#f2e520; }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-size:12px; color:var(--muted); min-height:18px; }
  .status.err { color:var(--bad); }
  .status.ok { color:var(--acc); }

  .cards { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:13px 14px; min-height:82px; }
  .card .l { color:var(--muted); font-size:11.5px; }
  .card .v { font-size:21px; font-weight:700; margin-top:4px; letter-spacing:.3px; }
  .card .h { color:var(--muted); font-size:11px; margin-top:2px; }
  .card.good .v { color:var(--good); }
  .card.muted .v { color:var(--muted); }

  .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .tab { padding:7px 16px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13px; }
  .tab.on { background:rgba(230,216,0,.11); color:var(--acc); font-weight:600; }
  .groups { display:flex; gap:7px; flex-wrap:wrap; }
  .chip { padding:5px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); font-size:12px; cursor:pointer; }
  .chip.on { border-color:rgba(230,216,0,.5); color:var(--acc); background:rgba(230,216,0,.08); }
  .chip .b { font-size:10.5px; opacity:.7; margin-left:6px; }

  .grid { display:grid; grid-template-columns:1.55fr 1fr; gap:14px; align-items:start; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .box h2 { font-size:14px; font-weight:650; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .box h2 .badge { font-size:11px; color:var(--muted); font-weight:400; }
  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .m { background:var(--panel2); border-radius:9px; padding:10px 11px; }
  .m .l { font-size:11.5px; color:var(--muted); }
  .m .v { font-size:17px; font-weight:650; margin-top:3px; }
  .m .h { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .m.good .v { color:var(--good); }
  .m.muted .v { color:var(--muted); }
  .bars { margin-top:14px; }
  .bar { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; }
  .bar .n { width:30px; color:var(--muted); }
  .bar .track { flex:1; height:7px; border-radius:5px; background:rgba(255,255,255,.07); overflow:hidden; }
  .bar .fill { height:100%; border-radius:5px; }
  .bar .c { width:32px; text-align:right; color:var(--muted); }
  .pool { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:9px 11px; border-radius:8px; background:var(--panel2); margin-top:7px; }
  .pool.cur { box-shadow:inset 0 0 0 1px rgba(230,216,0,.4); }
  .pool .nm { font-size:12.5px; }
  .pool .curTag { font-size:10px; color:var(--acc); margin-left:6px; }
  .pool .pv { font-size:12px; color:var(--muted); text-align:right; }
  .pool .pt { font-size:11px; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:11.5px;
       padding:0 8px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid rgba(255,255,255,.05); }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; min-width:34px; text-align:center; padding:1px 7px; border-radius:20px;
    font-size:10.5px; background:rgba(255,255,255,.09); color:var(--muted); }
  .pill.good { background:rgba(230,216,0,.16); color:var(--acc); }
  .pill.bad { background:rgba(226,112,95,.16); color:var(--bad); }
  .empty { color:var(--muted); font-size:12.5px; padding:22px 4px; text-align:center; }
  .notes { color:var(--muted); font-size:11.5px; line-height:1.9; border-top:1px solid var(--line); padding-top:12px; }
  .notes b { color:#c8ccd4; font-weight:600; }
  @media (max-width:1000px) {
    .cards { grid-template-columns:repeat(3,1fr); }
    .grid { grid-template-columns:1fr; }
  }
  @media (max-width:620px) {
    .cards { grid-template-columns:repeat(2,1fr); }
    .metrics { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="title"><h1>寻访记录</h1><span class="tag" id="modeTag">演示数据</span></div>
      <div class="sub" id="meta">终末地 · 角色 / 武器保底与出货统计</div>
    </div>
    <div class="sync">
      <input type="text" id="token" placeholder="鹰角账号 token（可留空用本地日志）" autocomplete="off">
      <button id="btnLog">读取本地日志</button>
      <button class="primary" id="btnSync">更新记录</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="cards" id="cards"></div>

  <div class="tabs" id="tabs"></div>
  <div class="groups" id="groups"></div>

  <div class="grid">
    <div class="box">
      <h2 id="groupTitle">—</h2>
      <div class="metrics" id="metrics"></div>
      <div class="bars" id="bars"></div>
      <div style="margin-top:16px" id="poolList"></div>
    </div>
    <div class="box">
      <h2>6★ 出货历史 <span class="badge" id="historyCount"></span></h2>
      <div id="history"></div>
    </div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<script>
/* 宿主注入 window.Arietta = { call(method, params) -> Promise, state: {get,set} }。
   没有桥时直接用内置演示模型渲染，方便浏览器离线预览。 */
const DEMO = {"meta":{"uid":"10000001","server":"1","lang":"","timezone":"+08:00","records":47,"source":"demo","pool_count":1},"cards":[{"label":"总寻访","value":"47","hint":"角色 35 · 武器 12","tone":""},{"label":"6★","value":"5","hint":"角色 4 · 武器 1","tone":"good"},{"label":"平均出货","value":"10.8","hint":"付费 6★ 平均抽数（去掉尾部垫抽）","tone":""},{"label":"5★ / 4★","value":"13 / 29","hint":"按稀有度计数","tone":""},{"label":"武库配额净值","value":"7,000","hint":"产出 8,980 · 消耗 1,980","tone":""},{"label":"已覆盖卡池","value":"4","hint":"官方仅保留近 90 天明细","tone":"muted"}],"tabs":[{"id":"char","label":"角色寻访","groups":[{"id":"special","label":"特许寻访","badge":"大保底 120","cards":[{"label":"总抽数","value":"20","hint":"付费 19 · 免费 1","tone":""},{"label":"6★","value":"3","hint":"平均 8.5 抽","tone":""},{"label":"当前垫抽","value":"2","hint":"距 80 抽保底还差 78","tone":""},{"label":"UP / 歪","value":"1 / 1","hint":"按卡池 UP 名单判定","tone":""},{"label":"大保底","value":"15/120","hint":"距上次 UP 的付费抽数","tone":"good"},{"label":"武库配额产出","value":"6,700","hint":"4★ 20 · 5★ 200 · 6★ 2000","tone":""}],"bars":[{"label":"6★","value":3,"color":"#E6D800"},{"label":"5★","value":2,"color":"#C864E0"},{"label":"4★","value":15,"color":"#5EAAED"}],"pools":[{"label":"special_pool_1","value":"20 抽","hint":"6★ 3 · 垫 2","current":true}],"history":[{"time":"2026-11-01 10:18","name":"常驻六星","pity":13,"tag":"歪","tone":"bad","new":false,"pool":"特许寻访 · 演示期"},{"time":"2026-11-01 10:05","name":"当期UP","pity":4,"tag":"UP","tone":"good","new":false,"pool":"特许寻访 · 演示期"},{"time":"2026-11-01 10:01","name":"干员1","pity":0,"tag":"赠送","tone":"muted","new":false,"pool":"特许寻访 · 演示期"}]},{"id":"rerun","label":"重构寻访","badge":"大保底 120","cards":[{"label":"总抽数","value":"10","hint":"付费 9 · 免费 1","tone":""},{"label":"6★","value":"0","hint":"暂无 6★","tone":""},{"label":"当前垫抽","value":"9","hint":"距 80 抽保底还差 71","tone":""},{"label":"UP / 歪","value":"0 / 0","hint":"缺少 UP 名单时不判歪","tone":"muted"},{"label":"大保底","value":"34/120","hint":"官方累计次数为准（服务器保留 90 天明细）","tone":""},{"label":"武库配额产出","value":"200","hint":"4★ 20 · 5★ 200 · 6★ 2000","tone":""}],"bars":[{"label":"6★","value":0,"color":"#E6D800"},{"label":"5★","value":0,"color":"#C864E0"},{"label":"4★","value":10,"color":"#5EAAED"}],"pools":[{"label":"重构寻访 #1","value":"10 抽","hint":"6★ 0 · 垫 9","current":true}],"history":[]},{"id":"beginner","label":"启程寻访","badge":"小保底 80","cards":[{"label":"总抽数","value":"5","hint":"付费 5 · 免费 0","tone":""},{"label":"6★","value":"1","hint":"平均 5.0 抽","tone":""},{"label":"当前垫抽","value":"0","hint":"距 80 抽保底还差 80","tone":""},{"label":"UP / 歪","value":"0 / 0","hint":"缺少 UP 名单时不判歪","tone":"muted"},{"label":"武库配额产出","value":"2,080","hint":"4★ 20 · 5★ 200 · 6★ 2000","tone":""}],"bars":[{"label":"6★","value":1,"color":"#E6D800"},{"label":"5★","value":0,"color":"#C864E0"},{"label":"4★","value":4,"color":"#5EAAED"}],"pools":[{"label":"beginner","value":"5 抽","hint":"6★ 1 · 垫 0","current":true}],"history":[{"time":"2026-11-02 10:35","name":"物品35","pity":5,"tag":"6★","tone":"muted","new":false,"pool":"启程寻访"}]}]},{"id":"weapon","label":"武器申领","groups":[{"id":"weaponbox_1_0_1","label":"限定申领 · 演示期","badge":"限定申领","cards":[{"label":"总抽数","value":"12","hint":"付费 12 · 免费 0","tone":""},{"label":"6★","value":"1","hint":"平均 10.0 抽","tone":""},{"label":"当前垫抽","value":"2","hint":"距 40 抽保底还差 38","tone":""},{"label":"UP / 歪","value":"1 / 0","hint":"按卡池 UP 名单判定","tone":""},{"label":"大保底","value":"2/80","hint":"距上次 UP 的付费抽数","tone":"good"},{"label":"武库配额消耗","value":"1,980","hint":"1 次十连 × 1980","tone":""}],"bars":[{"label":"6★","value":1,"color":"#E6D800"},{"label":"5★","value":11,"color":"#C864E0"},{"label":"4★","value":0,"color":"#5EAAED"}],"pools":[{"label":"weaponbox_1_0_1","value":"12 抽","hint":"6★ 1 · 垫 2","current":true}],"history":[{"time":"2026-11-05 12:00","name":"UP武器","pity":10,"tag":"UP","tone":"good","new":false,"pool":"限定申领 · 演示期"}]}]}],"notes":["演示数据：用于离线预览界面，不代表任何真实账号。","免费抽计入总抽与稀有度，但不推进、也不重置保底。","角色池 80 抽小保底；特许寻访每池 120 抽必出当期 UP；重构寻访大保底跨版本继承，可用时以官方累计寻访次数为准。","武器申领 40 / 80 保底按池独立；重构申领按版本期次分段。","UP / 歪需要卡池 UP 名单；接口未返回时标记「6★」而不臆断。"]};
const bridge = window.Arietta || null;
let model = null, activeTab = 0, activeGroup = 0;
let cachedAuth = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function hasCall() { return !!(bridge && typeof bridge.call === 'function'); }
async function call(method, params) {
  if (!hasCall()) throw new Error('当前是离线预览：需要 Arietta 的脚本桥才能同步记录');
  return await bridge.call(method, params || {});
}
async function stateGet(key) {
  if (bridge && bridge.state && typeof bridge.state.get === 'function') {
    try { return await bridge.state.get(key); } catch (e) { /* 回落 localStorage */ }
  }
  try { return JSON.parse(localStorage.getItem('ef.' + key) || 'null'); } catch (e) { return null; }
}
async function stateSet(key, value) {
  if (bridge && bridge.state && typeof bridge.state.set === 'function') {
    try { await bridge.state.set(key, value); return; } catch (e) { /* 回落 localStorage */ }
  }
  try { localStorage.setItem('ef.' + key, JSON.stringify(value)); } catch (e) { /* 忽略配额 */ }
}
function setStatus(text, kind) {
  const el = $('status');
  el.textContent = text || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function busy(on, label) {
  $('btnSync').disabled = on;
  $('btnLog').disabled = on;
  $('btnSync').textContent = on ? (label || '同步中…') : '更新记录';
}

function renderMeta() {
  const m = model.meta || {};
  const demo = m.source === 'demo';
  $('modeTag').textContent = demo ? '演示数据' : (hasCall() ? '已连接 Arietta' : '离线缓存');
  $('modeTag').style.display = demo ? '' : '';
  const bits = [];
  if (m.uid) bits.push('UID ' + esc(m.uid));
  if (m.records) bits.push(esc(m.records) + ' 条记录');
  if (m.server) bits.push('服务器 ' + esc(m.server));
  if (m.timezone) bits.push('时区 ' + esc(m.timezone));
  bits.push(demo ? '内置样例，仅供界面预览' : '数据源：游戏包 provider');
  $('meta').textContent = bits.join(' · ');
}

function renderCards() {
  $('cards').innerHTML = (model.cards || []).map((c) => `
    <div class="card ${esc(c.tone || '')}">
      <div class="l">${esc(c.label)}</div>
      <div class="v">${esc(c.value)}</div>
      <div class="h">${esc(c.hint || '')}</div>
    </div>`).join('');
}

function renderTabs() {
  $('tabs').innerHTML = (model.tabs || []).map((t, i) => `
    <div class="tab ${i === activeTab ? 'on' : ''}" data-i="${i}">${esc(t.label)}
      <span style="font-size:11px;opacity:.65">${(t.groups || []).length}</span></div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach((el) => el.onclick = () => {
    activeTab = Number(el.dataset.i); activeGroup = 0; renderTabs(); renderGroups(); renderGroup();
  });
}

function renderGroups() {
  const groups = (model.tabs[activeTab] || {}).groups || [];
  if (activeGroup >= groups.length) activeGroup = 0;
  $('groups').innerHTML = groups.map((g, i) => `
    <div class="chip ${i === activeGroup ? 'on' : ''}" data-i="${i}">${esc(g.label)}
      ${g.badge ? `<span class="b">${esc(g.badge)}</span>` : ''}</div>`).join('');
  $('groups').querySelectorAll('.chip').forEach((el) => el.onclick = () => {
    activeGroup = Number(el.dataset.i); renderGroups(); renderGroup();
  });
}

function renderGroup() {
  const tab = model.tabs[activeTab] || { groups: [] };
  const g = tab.groups[activeGroup];
  if (!g) {
    $('groupTitle').textContent = '暂无记录';
    $('metrics').innerHTML = ''; $('bars').innerHTML = '';
    $('poolList').innerHTML = '<div class="empty">这个分类还没有寻访记录</div>';
    $('history').innerHTML = '<div class="empty">—</div>';
    $('historyCount').textContent = '';
    return;
  }
  $('groupTitle').innerHTML = esc(g.label) + `<span class="badge">${esc(g.badge || '')}</span>`;
  $('metrics').innerHTML = (g.cards || []).map((c) => `
    <div class="m ${esc(c.tone || '')}">
      <div class="l">${esc(c.label)}</div>
      <div class="v">${esc(c.value)}</div>
      <div class="h">${esc(c.hint || '')}</div>
    </div>`).join('');
  const max = Math.max(1, ...(g.bars || []).map((b) => Number(b.value) || 0));
  $('bars').innerHTML = (g.bars || []).map((b) => `
    <div class="bar"><span class="n">${esc(b.label)}</span>
      <span class="track"><span class="fill" style="width:${Math.round((Number(b.value)||0)/max*100)}%;background:${esc(b.color || 'var(--acc)')}"></span></span>
      <span class="c">${esc(b.value)}</span></div>`).join('');
  $('poolList').innerHTML = (g.pools || []).length
    ? '<h2 style="margin-top:4px">卡池 <span class="badge">当前池高亮</span></h2>' +
      (g.pools || []).map((p) => `
        <div class="pool ${p.current ? 'cur' : ''}">
          <div class="nm">${esc(p.label)}${p.current ? '<span class="curTag">当前</span>' : ''}</div>
          <div class="pv">${esc(p.value)}<div class="pt">${esc(p.hint || '')}</div></div>
        </div>`).join('')
    : '';
  const h = g.history || [];
  $('historyCount').textContent = h.length ? h.length + ' 条' : '';
  $('history').innerHTML = h.length ? `
    <table><thead><tr><th>时间</th><th>名称</th><th>抽数</th><th>结果</th></tr></thead>
    <tbody>${h.map((x) => `
      <tr><td style="color:var(--muted);white-space:nowrap">${esc(x.time)}</td>
        <td>${esc(x.name)}${x.new ? '<span style="color:var(--acc);font-size:10px;margin-left:5px">NEW</span>' : ''}
          <div style="font-size:10.5px;color:var(--muted)">${esc(x.pool || '')}</div></td>
        <td>${esc(x.pity)}</td>
        <td><span class="pill ${esc(x.tone || '')}">${esc(x.tag)}</span></td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">这个卡池还没有 6★ 记录</div>';
}

function renderNotes() {
  $('notes').innerHTML = '<b>统计口径</b><br>' + (model.notes || []).map((n) => '· ' + esc(n)).join('<br>');
}

function render() {
  renderMeta(); renderCards(); renderTabs(); renderGroups(); renderGroup(); renderNotes();
}

async function sync() {
  if (!hasCall()) { setStatus('离线预览模式：请在 Arietta 内打开本页以同步真实记录。', 'err'); return; }
  busy(true, '同步中…');
  setStatus('正在从游戏包 provider 拉取寻访记录…');
  try {
    const params = {};
    const token = $('token').value.trim();
    if (token) params.token = token;
    if (cachedAuth && cachedAuth.u8_token) {
      params.u8_token = cachedAuth.u8_token;
      params.server_id = cachedAuth.server_id || '';
      params.uid = cachedAuth.uid || '';
    }
    const fetched = await call('fetch', params);
    if (!fetched || !fetched.ugf) throw new Error('provider 没有返回 UGF 数据');
    const summary = fetched.summary || {};
    const stats = await call('gacha-stats', {
      ugf: fetched.ugf,
      pool_info: summary.pool_info || {},
      rerun_counts: summary.rerun_counts || {},
      lang: 'zh-cn',
    });
    model = stats && stats.model ? stats.model : stats;
    if (!model || !model.tabs) throw new Error('统计数据格式异常');
    await stateSet('model', model);
    if (token) await stateSet('token', token);
    render();
    setStatus('同步完成 · ' + (summary.records ?? (model.meta || {}).records ?? 0) + ' 条记录', 'ok');
  } catch (e) {
    setStatus('同步失败：' + (e && e.message ? e.message : String(e)), 'err');
  } finally {
    busy(false);
  }
}

async function readLog() {
  if (!hasCall()) { setStatus('离线预览模式：无法读取本地日志。', 'err'); return; }
  busy(true, '读取中…');
  setStatus('正在查找客户端抽卡页面链接…');
  try {
    const auth = await call('gacha-url', {});
    cachedAuth = auth || null;
    if (!auth || !auth.u8_token) throw new Error('未在客户端日志里找到抽卡链接，请先在游戏内打开一次寻访记录页面');
    $('token').value = '';
    setStatus('已找到链接（' + (auth.provider || '') + ' · ' + (auth.uid || 'UID 未知') + '），点「更新记录」同步', 'ok');
  } catch (e) {
    setStatus('读取失败：' + (e && e.message ? e.message : String(e)), 'err');
  } finally {
    busy(false);
  }
}

async function boot() {
  $('btnSync').onclick = sync;
  $('btnLog').onclick = readLog;
  model = await stateGet('model');
  if (!model || !model.tabs) model = DEMO;
  const token = await stateGet('token');
  if (token) $('token').value = String(token);
  render();
  setStatus(model && model.meta && model.meta.source === 'demo'
    ? '演示数据 · 宿主内点「更新记录」即可同步真实寻访记录'
    : '已载入上次同步的记录', model && model.meta && model.meta.source === 'demo' ? '' : 'ok');
}
boot();
</script>
</body>
</html>
